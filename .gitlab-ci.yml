stages:
  - build
  - test

build_nodebackend:
  stage: build
  image: gcc:15
  before_script:
    - apt-get update -qq
    - apt-get install -y make git qt6-base-dev
    # download CMake 4.1.2
    - CMAKE_VER=4.1.2
    - wget https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz
    - tar -xzf cmake-${CMAKE_VER}-linux-x86_64.tar.gz
    - mv cmake-${CMAKE_VER}-linux-x86_64 /opt/cmake
    - ln -s /opt/cmake/bin/cmake /usr/local/bin/cmake
    - cmake --version
  script:
    - echo "Building NodeBackend..."
    - cd NodeBackend
    - mkdir -p build && cd build
    - cmake ..
    - cmake --build .
    - cmake --install . --prefix ./install
    - echo "Build did something!!!"
  artifacts:
    paths:
      - NodeBackend/build/install/
  rules:
    - if: $WEEKLY == "true"
      when: always
    - exists:
        - NodeBackend/CMakeLists.txt
    - changes: [NodeBackend/**/*]

test_nodebackend:
  stage: test
  image: gcc:15
  script:
    - echo "Testing NodeBackend..."
    - cd NodeBackend/build
    - ctest --output-on-failure || echo "No tests found."
  rules:
    - if: $WEEKLY == "true"
      when: always
    - exists:
        - NodeBackend/CMakeLists.txt
    - changes: [NodeBackend/**/*]

build_webui:
  stage: build
  image: ghcr.io/cirruslabs/flutter:latest
  script:
    - echo "Building Flutter WebUI..."
    - cd WebUI/managementserver_frontend
    - flutter pub get
    - flutter build web --release
  artifacts:
    paths:
      - WebUI/build/web/
  rules:
    - if: $WEEKLY == "true"
      when: always
    - exists:
        - WebUI/managementserver_frontend/pubspec.yaml
    - changes: [WebUI/**/*]

test_webui:
  stage: test
  image: ghcr.io/cirruslabs/flutter:latest
  script:
    - echo "Running Flutter tests..."
    - cd WebUI/managementserver_frontend
    - flutter test || echo "No tests found."
  rules:
    - if: $WEEKLY == "true"
      when: always
    - exists:
        - WebUI/managementserver_frontend/test/
    - changes: [WebUI/**/*]

build_discordbot:
  stage: build
  image: python:3.11
  before_script:
    - echo "Installing dependencies..."
    - cd DiscordBot
    - pip install -r requirements.txt
    - pip install ruff
  script:
    - ruff check .
  rules:
    - if: $WEEKLY == "true"
      when: always
    - exists:
        - DiscordBot/main.py
    - changes: [DiscordBot/**/*]

test_discordbot:
  stage: test
  image: python:3.11
  script:
    - echo "Running DiscordBot tests..."
    - cd DiscordBot
    - pytest || echo "No tests found."
  rules:
    - if: $WEEKLY == "true"
      when: always
    - exists:
        - DiscordBot/tests/
    - changes: [DiscordBot/**/*]

