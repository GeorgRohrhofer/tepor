##############################
# 🌍 WorldSynchronization (Rust)
##############################
build_worldsync:
  stage: build
  image: rust:1.80
  script:
    - echo "⚙️ Building WorldSynchronization..."
    - cd WorldSynchronization
    - cargo build --release
  artifacts:
    paths:
      - WorldSynchronization/target/release/
  rules:
    - exists:
        - WorldSynchronization/Cargo.toml

test_worldsync:
  stage: test
  image: rust:1.80
  script:
    - cd WorldSynchronization
    - cargo test -- --nocapture || echo "No tests found."
  rules:
    - exists:
        - WorldSynchronization/Cargo.toml
